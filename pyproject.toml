[tool.poetry]
name = "diplomas"
version = "0.1.0"
description = ""
authors = ["Артём Кравченко <artem.kravchenko@nvi-research.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.15"
neurokit2 = "^0.2.10"
scikit-learn = "^1.5.2"
clearml = "^2.0.2"
mlflow = "^2.17.2"
pyedflib = "^0.1.42"
ecg-plot = "^0.2.8"
pyqt5 = "^5.15.11"
loguru = "^0.7.3"
ipykernel = "^7.1.0"
torch = {version = "^2.9.1", source = "pytorch-cu130"}
torchvision = {version = "^0.24.1", source = "pytorch-cu130"}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"